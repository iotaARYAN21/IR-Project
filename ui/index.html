<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IR Search Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">IR<span>Search</span></div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">Dark</button>
  </header>

  <main class="container">
    <section class="search-panel" aria-label="Search settings">
      <form id="search-form">
        <div class="search-row">
          <label class="search-box">
            <span class="sr-only">Search query</span>
            <input id="query" name="query" type="search" placeholder="Search the NQ document collection" autocomplete="off" required>
          </label>
          <button class="search-button" type="submit">Search</button>
        </div>

        <div class="controls">
          <div class="method-group">
            <label>
              Method
              <select id="method">
                <option value="bm25">BM25</option>
                <option value="dense">Dense</option>
                <option value="hybrid" selected>Hybrid</option>
              </select>
            </label>
            <label id="slop-field" class="slop-field is-inactive">
              Proximity
              <select id="slop">
                <option value="" selected>Off</option>
                <option value="0">0 - Next to each other</option>
                <option value="1">1 - Very close</option>
                <option value="2">2 - Close</option>
                <option value="5">5 - Flexible</option>
                <option value="10">10 - Very flexible</option>
              </select>
            </label>
          </div>

          <label>
            Results
            <input id="k" type="number" min="1" max="1000" step="1" value="10">
          </label>

          <label>
            Candidates
            <input id="candidates" type="number" min="1" max="1000" step="1" value="30">
          </label>

          <label class="switch-label">
            <input id="rerank" type="checkbox">
            <span>Rerank</span>
          </label>

          <label class="switch-label">
            <input id="compare" type="checkbox">
            <span>Compare methods</span>
          </label>

          <div id="compare-method-field" class="method-group" hidden>
            <label>
              Compare against
              <select id="compare-method"></select>
            </label>
            <label id="compare-slop-field" class="slop-field is-inactive">
              Proximity
              <select id="compare-slop">
                <option value="" selected>Off</option>
                <option value="0">0 - Next to each other</option>
                <option value="1">1 - Very close</option>
                <option value="2">2 - Close</option>
                <option value="5">5 - Flexible</option>
                <option value="10">10 - Very flexible</option>
              </select>
            </label>
          </div>
        </div>
        <p id="proximity-hint" class="hint" hidden>Proximity ranks passages higher when the query words are close together. It applies to BM25 and hybrid only.</p>

        <details id="advanced-search" class="advanced-search" hidden>
          <summary>Custom BM25 search</summary>
          <p class="hint">These options apply to the BM25 results only.</p>
          <div class="controls advanced-controls">
            <label class="switch-label">
              <input id="exact-phrase" type="checkbox">
              <span>Exact phrase</span>
            </label>
            <label class="switch-label">
              <input id="title-only" type="checkbox">
              <span>Search title only</span>
            </label>
            <label>
              Must include
              <input id="must-include" type="text" maxlength="200" placeholder="e.g. policy">
            </label>
            <label>
              Must exclude
              <input id="must-exclude" type="text" maxlength="200" placeholder="e.g. sports">
            </label>
          </div>
        </details>
      </form>
    </section>

    <div id="status" class="status" role="status"></div>
    <section id="results" class="results-grid" aria-live="polite"></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
